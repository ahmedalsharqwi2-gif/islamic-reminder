name: Build Islamic Reminder Video

on:
  repository_dispatch:
    types: [build_islamic_reminder]
  workflow_dispatch:
    inputs:
      video_url:
        description: Direct downloadable Pexels video URL
        required: true
        type: string
      voice_text:
        description: Arabic reminder text to convert to speech
        required: true
        type: string
      background_url:
        description: Optional direct downloadable MP3/WAV background or Quran URL
        required: false
        type: string
      title:
        description: Video title
        required: true
        type: string
      job_tag:
        description: Unique tag, for example reminder-20260915-223000-abc123
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIDEO_URL: ${{ github.event.client_payload.video_url || inputs.video_url }}
      VOICE_TEXT: ${{ github.event.client_payload.voice_text || inputs.voice_text }}
      BACKGROUND_URL: ${{ github.event.client_payload.background_url || inputs.background_url }}
      TITLE: ${{ github.event.client_payload.title || inputs.title }}
      JOB_TAG: ${{ github.event.client_payload.job_tag || inputs.job_tag }}

    steps:
      - name: Validate input
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIDEO_URL" || { echo "Missing video_url"; exit 1; }
          test -n "$VOICE_TEXT" || { echo "Missing voice_text"; exit 1; }
          test -n "$JOB_TAG" || { echo "Missing job_tag"; exit 1; }
          JOB_TAG="${JOB_TAG#=}"
          TITLE="${TITLE#=}"
          VOICE_TEXT="${VOICE_TEXT#=}"
          BACKGROUND_URL="${BACKGROUND_URL#=}"
          echo "JOB_TAG=$JOB_TAG" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "VOICE_TEXT=$VOICE_TEXT" >> "$GITHUB_ENV"
          echo "BACKGROUND_URL=$BACKGROUND_URL" >> "$GITHUB_ENV"
          echo "Building $JOB_TAG"

      - name: Install FFmpeg tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download Pexels video and generate Arabic voice
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$VIDEO_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          raw = sys.argv[1].lstrip().lstrip("=").strip()
          parsed = urlparse(raw)
          if parsed.scheme not in {"http", "https"} or not parsed.netloc:
              raise SystemExit(
                  "Invalid VIDEO_URL. n8n must send the direct video_files[].link URL, "
                  f"not: {raw!r}"
              )
          print(f"Downloading video from host: {parsed.netloc}")
          PY

          VIDEO_URL="${VIDEO_URL#=}"
          curl --fail --location --retry 3 --retry-delay 2 \
            --url "$VIDEO_URL" -o source.mp4

          duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 source.mp4)"

          python3 - "$duration" <<'PY'
          import sys

          value = float(sys.argv[1])
          if value <= 0:
              raise SystemExit("Downloaded video has no valid duration.")
          print(f"Source video duration: {value:.2f} seconds ({value / 60:.2f} minutes)")
          PY

          python3 -m pip install --quiet edge-tts

          edge-tts \
            --voice ar-SA-HamedNeural \
            --text "$VOICE_TEXT" \
            --write-media voice.mp3

          if [ -n "$BACKGROUND_URL" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              --url "$BACKGROUND_URL" -o background.audio
            ffmpeg -y -hide_banner -loglevel error \
              -i background.audio -vn -c:a libmp3lame -b:a 128k background.mp3
            test -s background.mp3
          fi

          test -s source.mp4
          test -s voice.mp3
          file source.mp4 voice.mp3

      - name: Render vertical short with ffmpeg
        shell: bash
        run: |
          set -euo pipefail

          # Loop/crop the stock video to 1080x1920 and stop when the voice ends.
          # The source video has no audio, so the generated Arabic voice is the only audio track.
          if [ -s background.mp3 ]; then
            ffmpeg -y -hide_banner -loglevel error \
              -stream_loop -1 -i source.mp4 -i voice.mp3 -stream_loop -1 -i background.mp3 \
              -filter_complex "[1:a]volume=1.0[voice];[2:a]volume=0.12[bg];[voice][bg]amix=inputs=2:duration=first:dropout_transition=2[mix]" \
              -map 0:v:0 -map "[mix]" -shortest \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,format=yuv420p" \
              -c:v libx264 -preset medium -crf 20 -r 30 \
              -c:a aac -b:a 192k -movflags +faststart \
              "${JOB_TAG}.mp4"
          else
            ffmpeg -y -hide_banner -loglevel error \
              -stream_loop -1 -i source.mp4 -i voice.mp3 \
              -map 0:v:0 -map 1:a:0 -shortest \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,format=yuv420p" \
              -c:v libx264 -preset medium -crf 20 -r 30 \
              -c:a aac -b:a 192k -movflags +faststart \
              "${JOB_TAG}.mp4"
          fi

          test -s "${JOB_TAG}.mp4"

          final_duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "${JOB_TAG}.mp4")"
          echo "Final video duration: ${final_duration} seconds"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.JOB_TAG }}
          name: ${{ env.TITLE }}
          body: |
            Generated Islamic reminder video.
            Source video: Pexels
            Voice: edge-tts Arabic neural voice
            Build: ${{ github.run_id }}
          draft: false
          prerelease: false
          files: ${{ env.JOB_TAG }}.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print asset URL
        shell: bash
        run: |
          echo "Release tag: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${JOB_TAG}"
          echo "Asset URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${JOB_TAG}/${JOB_TAG}.mp4"

      - name: Cleanup source files
        if: always()
        shell: bash
        run: |
          rm -f source.mp4 voice.mp3 background.audio background.mp3 "${JOB_TAG}.mp4" || true

# Required repository settings:
# - Actions must be enabled.
# - The repository must allow GITHUB_TOKEN to write Contents.
# - n8n must use a GitHub token with permission to call repository_dispatch.
# - The Pexels video URL must be publicly downloadable by GitHub runners.
# - Release tags must be unique; n8n generates JOB_TAG for every run.
#
# The n8n Dispatch GitHub Render node must send this payload:
# {
#   "event_type": "build_islamic_reminder",
#   "client_payload": {
#     "video_url": "https://...",
#     "voice_text": "النص العربي هنا",
#     "title": "عنوان الفيديو",
#     "job_tag": "reminder-test-001"
#   }
# }
#
# No StreamElements audio URL is used. The Arabic MP3 is generated in the runner
# with edge-tts and ar-SA-HamedNeural.
